name: Process photo inbox

on:
  push:
    branches: [main]
    paths: ["photos-inbox/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write # the "request a Pages build" API call needs this

concurrency:
  group: photo-pipeline
  cancel-in-progress: false # queue runs so two quick uploads both process

jobs:
  process:
    runs-on: ubuntu-latest
    # loop guard: never re-trigger on the pipeline's own commits
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit.author.name != 'github-actions[bot]' &&
       !contains(github.event.head_commit.message, '[photo-pipeline]'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Process inbox
        id: process
        run: node scripts/process-inbox.mjs

      - name: Commit results
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            MSG="chore: process photo inbox [photo-pipeline]"
            SKIPPED="${{ steps.process.outputs.skipped }}"
            if [ -n "$SKIPPED" ] && [ "$SKIPPED" != "0" ]; then
              MSG="$MSG ($SKIPPED skipped)"
            fi
            git commit -m "$MSG"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, and
      # branch-based Pages deployment is one — request the build explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
